# MANTA paper setup with the backbone/judge model replaced by DeepSeek V4.1 Flash.
# StableToolBench is intentionally absent from this config and from the runner.

[openrouter]
api_key = ""
base_url = "https://api.deepseek.com"
timeout_s = 600.0

[experiment]
output_dir = "artifacts/full_experiment"
runs_per_task = 3
seed = 42
task_limit = 30

[models]
default = "deepseek-flash"
judge = "deepseek-flash"

[mas]
topology = "self_evolved"
number_of_agents = 5
agent_types = ["general"]
levels = 1
intra_level_link_ratio = 1.0
full_linked = true
communication_count_internally = 2
discussion_rounds = 1
minimum_discussion_rounds = 1
max_turns = 2
turn_mode = "multi_turn"
enable_dynamic_roles = true
termination_consensus_mode = "llm_judge"
final_vote_mode = "llm_judge"
peer_artifact_max_chars = 0

[self_evolved]
harness_backend = "openrouter"
initial_planner_mode = "task_conditioned"
max_initial_agents = 5
max_total_agents = 10
max_turns = 2
repair_budget = 1
audit_mode = "hybrid"
playbook_path = "config/topology_playbook.json"
skill_path = "artifacts/deepseek_flash_state/topology_skill.md"
playbook_read = true
skill_update_batch_size = 12
default_packet_max_chars = 0

[browsecomp]
decrypted_path = "benchmark/browsecomp/data/browsecomp_plus_decrypted.jsonl"
qrel_evidence_path = "benchmark/browsecomp/topics-qrels/qrel_evidence.txt"
qrel_golds_path = "benchmark/browsecomp/topics-qrels/qrel_golds.txt"
auto_download = true
eval_mode = "substring"
enable_tools = true
tool_k = 5
include_get_document = true
tool_snippet_max_tokens = 160
max_tool_iterations = 6

[plancraft]
split = "val.small"
max_steps = 30
resolution = "high"
recipe_search = false

[workbench]
domain = "multi_domain"
tool_selection = "domains"
max_tool_iterations = 20

[math500]
split = "test"
dataset_name = "HuggingFaceH4/MATH-500"
